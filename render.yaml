services:
  - type: web
    name: launch-structure-verifier
    runtime: rust
    plan: free
    buildCommand: cargo build --release --bin launch-structure-verifier-server
    startCommand: ./target/release/launch-structure-verifier-server
    healthCheckPath: /health
    envVars:
      - key: HELIUS_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://zsinkala.github.io
      - key: PAYMENT_WALLET_ADDRESS
        value: 0x6aeaEC86d147e5A13cB7bD50CF2200C85656D6d9
      - key: PAID_REPORT_PRICE_USDC
        value: "5"
