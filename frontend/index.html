<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Structure Verifier</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
        }
        .status-pass { color: #059669; }
        .status-fail { color: #dc2626; }
        .status-unknown { color: #6b7280; }
    </style>
</head>
<body class="p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // PRODUCTION API URL
        const API_URL = 'https://launch-structure-verifier.onrender.com/api/v1/analyze';
        const PAYMENT_VERIFY_URL = 'https://launch-structure-verifier.onrender.com/api/v1/payments/verify';
        const PAYMENT_WALLET = '0x6aeaEC86d147e5A13cB7bD50CF2200C85656D6d9';
        const PAID_REPORT_PRICE = '5';
        const BASE_USDC_CONTRACT = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';

        async function analyzeToken(chain, address, forceRefresh = false) {
            const cleanAddress = address.trim();
            
            console.log('Analyzing:', chain, cleanAddress, 'Force refresh:', forceRefresh);
            
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chain: chain,
                    address: cleanAddress,
                    options: {
                        include_holders: true,
                        max_holders: 10,
                        force_refresh: forceRefresh
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            console.log('Received response:', data);
            return data;
        }

        function extractTxHash(value) {
            const match = value.trim().match(/0x[a-fA-F0-9]{64}/);
            return match ? match[0] : value.trim();
        }

        async function verifyPayment(txHash, tokenAddress) {
            const response = await fetch(PAYMENT_VERIFY_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    tx_hash: extractTxHash(txHash),
                    token_address: tokenAddress.trim()
                })
            });

            if (!response.ok) {
                if (response.status === 502) {
                    throw new Error("Payment verification service is temporarily failing while checking RPC or payment storage. Your transaction may still be valid.");
                }
                throw new Error(`Payment verification failed with status ${response.status}`);
            }

            return response.json();
        }

        function App() {
            const [chain, setChain] = useState("solana");
            const [address, setAddress] = useState("");
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [forceRefresh, setForceRefresh] = useState(false);
            const [paymentTxHash, setPaymentTxHash] = useState("");
            const [paymentStatus, setPaymentStatus] = useState(null);
            const [paymentError, setPaymentError] = useState(null);
            const [verifyingPayment, setVerifyingPayment] = useState(false);
            const [paidReportAccessId, setPaidReportAccessId] = useState(null);
            const [reportActionMessage, setReportActionMessage] = useState(null);

            const handleAnalyze = async (e) => {
                e.preventDefault();
                if (!address.trim()) return;

                setLoading(true);
                setError(null);
                setResult(null);
                setPaymentTxHash("");
                setPaymentStatus(null);
                setPaymentError(null);
                setPaidReportAccessId(null);
                setReportActionMessage(null);

                try {
                    const data = await analyzeToken(chain, address, forceRefresh);
                    setResult(data);
                } catch (err) {
                    setError(err.message || "Failed to analyze token. Please try again.");
                    console.error('Error:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleVerifyPayment = async (e) => {
                e.preventDefault();
                if (!result || !paymentTxHash.trim()) return;

                setVerifyingPayment(true);
                setPaymentError(null);
                setPaymentStatus(null);

                try {
                    const data = await verifyPayment(paymentTxHash, result.address);
                    setPaymentStatus(data);
                    if (data.valid) {
                        setPaidReportAccessId(data.report_access_id);
                    } else {
                        setPaymentError(null);
                    }
                } catch (err) {
                    setPaymentError(err.message || "Could not verify payment.");
                    console.error('Payment verification error:', err);
                } finally {
                    setVerifyingPayment(false);
                }
            };

            const buildPaidReportExport = () => {
                const buyerVerdict = getBuyerVerdict(result);

                return {
                    report_access_id: paidReportAccessId,
                    generated_at: new Date().toISOString(),
                    buyer_verdict: buyerVerdict,
                    payment: {
                        tx_hash: extractTxHash(paymentTxHash),
                        amount_usdc: paymentStatus?.amount_usdc || PAID_REPORT_PRICE,
                        network: "Base",
                        pay_to: PAYMENT_WALLET,
                        usdc_contract: BASE_USDC_CONTRACT
                    },
                    analysis: result
                };
            };

            const copyReportAccessId = async () => {
                if (!paidReportAccessId) return;

                try {
                    await navigator.clipboard.writeText(paidReportAccessId);
                    setReportActionMessage("Report access ID copied.");
                } catch (err) {
                    setReportActionMessage("Could not copy automatically. Select the report access ID manually.");
                }
            };

            const downloadReportJson = () => {
                if (!paidReportAccessId || !result) return;

                const report = buildPaidReportExport();
                const blob = new Blob([JSON.stringify(report, null, 2)], {
                    type: "application/json"
                });
                const url = URL.createObjectURL(blob);
                const tokenLabel = (result.token?.symbol || result.token?.name || result.address || "token")
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-|-$/g, "");
                const link = document.createElement("a");
                link.href = url;
                link.download = `launch-structure-report-${tokenLabel || "token"}.json`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
                setReportActionMessage("Report JSON downloaded.");
            };

            const escapeHtml = (value) => {
                return String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            };

            const buildPrintableReportHtml = () => {
                const report = buildPaidReportExport();
                const tokenName = result.token?.symbol || result.token?.name || 'Token';
                const checkRows = result.checks.map(check => {
                    const component = checkComponent(result, check.id);
                    const evidenceRows = Object.entries(check.evidence || {})
                        .map(([key, value]) => `
                            <div class="evidence-item">
                                <dt>${escapeHtml(formatReportKey(key))}</dt>
                                <dd>${escapeHtml(formatReportValue(key, value))}</dd>
                            </div>
                        `)
                        .join('');

                    return `
                        <section class="check">
                            <div class="check-heading">
                                <div>
                                    <h3>${escapeHtml(check.label)}</h3>
                                    <p>${escapeHtml(formatReportKey(check.category))} / ${escapeHtml(check.severity)} severity / Weight ${escapeHtml(check.weight)}</p>
                                </div>
                                <span class="pill ${escapeHtml(check.status.toLowerCase())}">${escapeHtml(check.status)}</span>
                            </div>
                            <div class="metrics">
                                <div><span>Component Score</span><strong>${check.score_component !== null ? `${escapeHtml(check.score_component)}/100` : 'Excluded'}</strong></div>
                                <div><span>Weighted Points</span><strong>${component?.weighted_points !== null && component?.weighted_points !== undefined ? escapeHtml(component.weighted_points.toFixed(2)) : 'Excluded'}</strong></div>
                            </div>
                            <dl class="evidence">${evidenceRows}</dl>
                        </section>
                    `;
                }).join('');

                const findings = [
                    ...failedChecks.map(check => `<li><strong>${escapeHtml(check.label)}</strong>: failed ${escapeHtml(check.severity.toLowerCase())} severity check.</li>`),
                    ...unknownChecks.map(check => `<li><strong>${escapeHtml(check.label)}</strong>: data was unavailable, so this weight was excluded from the score.</li>`)
                ];
                const findingHtml = findings.length > 0
                    ? findings.join('')
                    : '<li>No failed or unknown structural checks were detected in this analysis.</li>';

                return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Structure Report - ${escapeHtml(tokenName)}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #111827; background: #f8fafc; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { max-width: 920px; margin: 0 auto; padding: 36px 28px; background: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; gap: 24px; border-bottom: 2px solid #111827; padding-bottom: 20px; margin-bottom: 24px; }
        h1, h2, h3 { margin: 0; line-height: 1.2; }
        h1 { font-size: 30px; }
        h2 { font-size: 18px; margin-bottom: 10px; }
        h3 { font-size: 15px; }
        .muted { color: #6b7280; }
        .score { text-align: right; }
        .score strong { display: block; font-size: 34px; }
        .grade { display: inline-block; border: 1px solid #d1d5db; border-radius: 999px; padding: 4px 10px; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
        .card, .verdict, .check { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; background: #fff; }
        .card span, .metrics span, dt { display: block; color: #6b7280; font-size: 12px; }
        .card strong, .metrics strong { display: block; margin-top: 3px; word-break: break-word; }
        .verdict { border-color: #d1d5db; background: #f9fafb; margin-bottom: 22px; }
        section { margin: 22px 0; }
        ul { padding-left: 20px; }
        .check { break-inside: avoid; margin-bottom: 12px; }
        .check-heading { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
        .pill { border: 1px solid #d1d5db; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; height: fit-content; }
        .pill.pass { color: #047857; background: #ecfdf5; border-color: #a7f3d0; }
        .pill.fail { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
        .pill.unknown { color: #4b5563; background: #f9fafb; border-color: #d1d5db; }
        .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
        .metrics > div, .evidence-item { background: #f9fafb; border-radius: 6px; padding: 9px; }
        .evidence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
        dd { margin: 2px 0 0; word-break: break-word; }
        .fine-print { border-top: 1px solid #e5e7eb; padding-top: 14px; margin-top: 28px; color: #6b7280; font-size: 12px; }
        @media print {
            body { background: #fff; }
            main { padding: 0; max-width: none; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <p class="muted">Launch Structure Verifier</p>
                <h1>${escapeHtml(tokenName)} Structural Report</h1>
                <p class="muted">Generated ${escapeHtml(report.generated_at)}</p>
            </div>
            <div class="score">
                <span class="grade">${escapeHtml(result.score.grade)}</span>
                <strong>${escapeHtml(result.score.fairness_score || 'N/A')}/100</strong>
                <p class="muted">${escapeHtml(result.status)}</p>
            </div>
        </header>

        <div class="grid">
            <div class="card"><span>Token</span><strong>${escapeHtml(tokenName)}</strong></div>
            <div class="card"><span>Chain</span><strong>${escapeHtml(result.chain)}</strong></div>
            <div class="card"><span>Report ID</span><strong>${escapeHtml(paidReportAccessId)}</strong></div>
            <div class="card"><span>Payment</span><strong>${escapeHtml(report.payment.amount_usdc)} USDC</strong></div>
        </div>

        <section class="verdict">
            <h2>Buyer Verdict: ${escapeHtml(report.buyer_verdict.label)}</h2>
            <p>${escapeHtml(report.buyer_verdict.reasoning)}</p>
        </section>

        <section>
            <h2>Executive Summary</h2>
            <p>${escapeHtml(result.explain.summary)}</p>
            <ul>
                <li>Passed checks: ${escapeHtml(passedChecks.length)}</li>
                <li>Failed checks: ${escapeHtml(failedChecks.length)}</li>
                <li>Unknown checks: ${escapeHtml(unknownChecks.length)}</li>
            </ul>
        </section>

        <section>
            <h2>Key Findings</h2>
            <ul>${findingHtml}</ul>
        </section>

        <section>
            <h2>Evidence Review</h2>
            ${checkRows}
        </section>

        <section>
            <h2>Scoring Method</h2>
            <p><strong>Model:</strong> ${escapeHtml(result.score.model)}</p>
            <p><strong>Active weight total:</strong> ${escapeHtml(result.score.weights_total)}</p>
            <ul>${result.score.notes.map(note => `<li>${escapeHtml(note)}</li>`).join('')}</ul>
        </section>

        <section>
            <h2>Interpretation</h2>
            <ul>${result.explain.interpretation.what_to_do.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
        </section>

        <p class="fine-print">Structural analysis only. This report is not investment advice, price prediction, or a recommendation to buy or sell any token.</p>
    </main>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => window.print(), 250);
        });
    <\/script>
</body>
</html>`;
            };

            const printReport = () => {
                if (!paidReportAccessId || !result) return;

                const html = buildPrintableReportHtml();
                const printWindow = window.open('', '_blank', 'noopener,noreferrer');
                if (!printWindow) {
                    setReportActionMessage("Could not open the print report. Allow popups for this site and try again.");
                    return;
                }

                printWindow.document.open();
                printWindow.document.write(html);
                printWindow.document.close();
                setReportActionMessage("Printable report opened.");
            };

            const getGradeColor = (grade) => {
                switch(grade) {
                    case 'Strong': return 'text-green-700 bg-green-50';
                    case 'Mixed': return 'text-yellow-700 bg-yellow-50';
                    case 'Fragile': return 'text-orange-700 bg-orange-50';
                    case 'Compromised': return 'text-red-700 bg-red-50';
                    default: return 'text-gray-700 bg-gray-50';
                }
            };

            const getStatusIcon = (status) => {
                switch(status) {
                    case 'Pass': return '✓';
                    case 'Fail': return '✗';
                    case 'Unknown': return '?';
                    default: return '·';
                }
            };

            const getStatusPill = (status) => {
                switch(status) {
                    case 'Pass': return 'bg-green-50 text-green-700 border-green-200';
                    case 'Fail': return 'bg-red-50 text-red-700 border-red-200';
                    case 'Unknown': return 'bg-gray-50 text-gray-700 border-gray-200';
                    default: return 'bg-gray-50 text-gray-700 border-gray-200';
                }
            };

            const formatReportKey = (key) => {
                return key
                    .replace(/_/g, ' ')
                    .replace(/\b\w/g, char => char.toUpperCase());
            };

            const formatReportValue = (key, value) => {
                if (value === null || value === undefined) return 'Unavailable';
                if (typeof value === 'boolean') return value ? 'Yes' : 'No';
                if (typeof value === 'number') {
                    const formatted = Number.isInteger(value) ? String(value) : value.toFixed(2).replace(/\.?0+$/, '');
                    return key.includes('pct') ? `${formatted}%` : formatted;
                }
                if (typeof value === 'string') return value.replace(/_/g, ' ');
                if (Array.isArray(value)) {
                    if (value.length === 0) return 'None reported';
                    return value.map(item => formatReportValue(key, item)).join(', ');
                }
                if (typeof value === 'object') {
                    return Object.entries(value)
                        .map(([nestedKey, nestedValue]) => `${formatReportKey(nestedKey)}: ${formatReportValue(nestedKey, nestedValue)}`)
                        .join('; ');
                }
                return String(value);
            };

            const checkComponent = (result, checkId) => {
                return result.score.components.find(component => component.id === checkId);
            };

            const getBuyerVerdict = (result) => {
                const failed = result.checks.filter(check => check.status === 'Fail');
                const unknown = result.checks.filter(check => check.status === 'Unknown');
                const criticalFailures = failed.filter(check => check.severity === 'Critical');
                const mediumOrHighFailures = failed.filter(check => ['High', 'Medium'].includes(check.severity));
                const grade = result.score.grade;

                if (criticalFailures.length > 0 || grade === 'Compromised') {
                    return {
                        label: 'High structural risk',
                        tone: 'red',
                        reasoning: 'A critical launch control check failed, so the structure has a serious trust or supply-control concern regardless of the numeric score.'
                    };
                }

                if (mediumOrHighFailures.length > 0 || grade === 'Fragile') {
                    return {
                        label: 'High structural risk',
                        tone: 'orange',
                        reasoning: 'One or more meaningful structural checks failed, which points to elevated launch risk that deserves careful review before relying on the token.'
                    };
                }

                if (unknown.length > 0 || grade === 'Mixed') {
                    return {
                        label: 'Mixed structural risk',
                        tone: 'yellow',
                        reasoning: 'No critical failure was detected, but some evidence is missing or the score is mixed, so the structure is not fully confirmed.'
                    };
                }

                return {
                    label: 'Low structural risk',
                    tone: 'green',
                    reasoning: 'The available structural checks passed and no major launch-control warning was detected in this analysis.'
                };
            };

            const getVerdictColor = (tone) => {
                switch(tone) {
                    case 'green': return 'bg-green-50 border-green-200 text-green-800';
                    case 'yellow': return 'bg-yellow-50 border-yellow-200 text-yellow-800';
                    case 'orange': return 'bg-orange-50 border-orange-200 text-orange-800';
                    case 'red': return 'bg-red-50 border-red-200 text-red-800';
                    default: return 'bg-gray-50 border-gray-200 text-gray-800';
                }
            };

            const exampleAddresses = chain === "solana" 
                ? "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263 (BONK) or EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v (USDC)"
                : "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 (USDC on Base)";

            const failedChecks = result ? result.checks.filter(check => check.status === 'Fail') : [];
            const unknownChecks = result ? result.checks.filter(check => check.status === 'Unknown') : [];
            const passedChecks = result ? result.checks.filter(check => check.status === 'Pass') : [];
            const buyerVerdict = result ? getBuyerVerdict(result) : null;

            return (
                <div className="max-w-4xl mx-auto">
                    <header className="mb-8">
                        <h1 className="text-3xl font-normal mb-2">Launch Structure Verifier</h1>
                        <p className="text-gray-600">Structural analysis only. No price, no prediction.</p>
                        <p className="text-xs text-gray-500 mt-2">
                            Multi-chain trust infrastructure • Analyze tokens on Solana and Base
                        </p>
                    </header>

                    <form onSubmit={handleAnalyze} className="mb-8 bg-white p-6 rounded-lg shadow-sm">
                        <div className="mb-4">
                            <label className="block text-sm font-medium mb-2">Chain</label>
                            <select 
                                value={chain} 
                                onChange={(e) => setChain(e.target.value)}
                                className="w-full p-2 border rounded"
                            >
                                <option value="solana">Solana</option>
                                <option value="base">Base</option>
                            </select>
                        </div>

                        <div className="mb-4">
                            <label className="block text-sm font-medium mb-2">Token Address</label>
                            <input
                                type="text"
                                value={address}
                                onChange={(e) => setAddress(e.target.value)}
                                placeholder="Enter token address..."
                                className="w-full p-2 border rounded font-mono text-sm"
                            />
                            <p className="text-xs text-gray-500 mt-1">
                                Try: {exampleAddresses}
                            </p>
                        </div>

                        <div className="mb-4">
                            <label className="flex items-center text-sm">
                                <input
                                    type="checkbox"
                                    checked={forceRefresh}
                                    onChange={(e) => setForceRefresh(e.target.checked)}
                                    className="mr-2"
                                />
                                Force refresh (bypass cache)
                            </label>
                        </div>

                        <button
                            type="submit"
                            disabled={loading || !address.trim()}
                            className="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
                        >
                            {loading ? 'Analyzing on-chain data...' : 'Analyze'}
                        </button>
                    </form>

                    {error && (
                        <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded mb-8">
                            <strong>Error:</strong> {error}
                        </div>
                    )}

                    {result && (
                        <div className="space-y-6">
                            <div className="bg-gray-100 p-3 rounded text-xs font-mono">
                                <div>Chain: {result.chain}</div>
                                <div>Address: {result.address}</div>
                                <div>Analysis ID: {result.analysis_id}</div>
                            </div>

                            <div className="bg-white p-6 rounded-lg shadow-sm">
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h2 className="text-xl font-medium">{result.token?.symbol || 'Token'}</h2>
                                        {result.token?.name && (
                                            <p className="text-sm text-gray-600">{result.token.name}</p>
                                        )}
                                    </div>
                                    <div className="text-right">
                                        <div className={`inline-block px-3 py-1 rounded font-medium ${getGradeColor(result.score.grade)}`}>
                                            {result.score.grade}
                                        </div>
                                        <div className="text-2xl font-bold mt-1">
                                            {result.score.fairness_score || 'N/A'}/100
                                        </div>
                                    </div>
                                </div>
                                <p className="text-gray-700">{result.explain.summary}</p>
                            </div>

                            <div className="bg-white p-6 rounded-lg shadow-sm">
                                <h3 className="text-lg font-medium mb-4">Structural Checks</h3>
                                <div className="space-y-3">
                                    {result.checks.map(check => (
                                        <div key={check.id} className="flex items-center justify-between py-2 border-b last:border-b-0">
                                            <div className="flex items-center">
                                                <span className={`mr-3 text-lg font-bold status-${check.status.toLowerCase()}`}>
                                                    {getStatusIcon(check.status)}
                                                </span>
                                                <div>
                                                    <div className="font-medium">{check.label}</div>
                                                    <div className="text-xs text-gray-500">
                                                        Severity: {check.severity}
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                {check.score_component !== null ? (
                                                    <span className="font-mono text-sm">{check.score_component}/100</span>
                                                ) : (
                                                    <span className="text-gray-400 text-sm">N/A</span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-lg shadow-sm">
                                <h3 className="text-lg font-medium mb-4">What This Means</h3>
                                <ul className="space-y-2">
                                    {result.explain.interpretation.what_to_do.map((item, idx) => (
                                        <li key={idx} className="text-gray-700">• {item}</li>
                                    ))}
                                </ul>
                            </div>

                            <div className="bg-white p-6 rounded-lg shadow-sm">
                                <div className="flex items-start justify-between gap-4 mb-4">
                                    <div>
                                        <h3 className="text-lg font-medium">Paid Report</h3>
                                        <p className="text-sm text-gray-600 mt-1">
                                            Pay {PAID_REPORT_PRICE} USDC on Base, then paste the transaction hash to unlock the detailed report.
                                        </p>
                                    </div>
                                    <span className="text-sm font-medium bg-blue-50 text-blue-700 px-3 py-1 rounded">
                                        {PAID_REPORT_PRICE} USDC
                                    </span>
                                </div>

                                <div className="bg-gray-50 p-3 rounded text-xs font-mono break-all mb-4">
                                    <div>Network: Base</div>
                                    <div>Token: USDC</div>
                                    <div>USDC Contract: {BASE_USDC_CONTRACT}</div>
                                    <div>Pay To: {PAYMENT_WALLET}</div>
                                </div>

                                <div className="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded text-sm mb-4">
                                    Valid payments must be sent on Base, use official Base USDC, go to the wallet above, and be at least {PAID_REPORT_PRICE} USDC. Each transaction hash unlocks one report.
                                </div>

                                {!paidReportAccessId ? (
                                    <form onSubmit={handleVerifyPayment} className="space-y-3">
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Base Transaction Hash</label>
                                            <input
                                                type="text"
                                                value={paymentTxHash}
                                                onChange={(e) => setPaymentTxHash(e.target.value)}
                                                placeholder="0x... or BaseScan transaction URL"
                                                className="w-full p-2 border rounded font-mono text-sm"
                                            />
                                        </div>

                                        {paymentError && (
                                            <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded text-sm">
                                                {paymentError}
                                            </div>
                                        )}

                                        {paymentStatus && !paymentStatus.valid && (
                                            <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 p-3 rounded text-sm">
                                                {paymentStatus.message}
                                            </div>
                                        )}

                                        <button
                                            type="submit"
                                            disabled={verifyingPayment || !paymentTxHash.trim()}
                                            className="w-full bg-black text-white py-2 px-4 rounded hover:bg-gray-800 disabled:bg-gray-300 disabled:cursor-not-allowed"
                                        >
                                            {verifyingPayment ? 'Verifying payment...' : 'Verify Payment'}
                                        </button>
                                    </form>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-green-50 border border-green-200 text-green-700 p-3 rounded text-sm">
                                            Payment verified. Report access ID: <span className="font-mono">{paidReportAccessId}</span>
                                        </div>

                                        <div className="flex flex-wrap gap-2">
                                            <button
                                                type="button"
                                                onClick={copyReportAccessId}
                                                className="px-3 py-2 border rounded text-sm hover:bg-gray-50"
                                            >
                                                Copy ID
                                            </button>
                                            <button
                                                type="button"
                                                onClick={downloadReportJson}
                                                className="px-3 py-2 border rounded text-sm hover:bg-gray-50"
                                            >
                                                Download JSON
                                            </button>
                                            <button
                                                type="button"
                                                onClick={printReport}
                                                className="px-3 py-2 border rounded text-sm hover:bg-gray-50"
                                            >
                                                Print / Save PDF
                                            </button>
                                        </div>

                                        {reportActionMessage && (
                                            <div className="bg-gray-50 border text-gray-700 p-3 rounded text-sm">
                                                {reportActionMessage}
                                            </div>
                                        )}

                                        <div className="border rounded p-4">
                                            <div className="flex items-start justify-between gap-4 mb-4">
                                                <div>
                                                    <h4 className="font-medium">Detailed Report</h4>
                                                    <p className="text-sm text-gray-600 mt-1">
                                                        A structured readout of the score, risks, and on-chain evidence behind this analysis.
                                                    </p>
                                                </div>
                                                <div className={`px-3 py-1 rounded border text-sm font-medium ${getGradeColor(result.score.grade)}`}>
                                                    {result.score.grade}
                                                </div>
                                            </div>

                                            <div className="grid md:grid-cols-4 gap-3 mb-5 text-sm">
                                                <div className="bg-gray-50 p-3 rounded">
                                                    <div className="text-xs text-gray-500">Token</div>
                                                    <div className="font-medium">{result.token?.symbol || result.token?.name || 'Unknown'}</div>
                                                </div>
                                                <div className="bg-gray-50 p-3 rounded">
                                                    <div className="text-xs text-gray-500">Chain</div>
                                                    <div className="font-medium capitalize">{result.chain}</div>
                                                </div>
                                                <div className="bg-gray-50 p-3 rounded">
                                                    <div className="text-xs text-gray-500">Score</div>
                                                    <div className="font-medium">{result.score.fairness_score || 'N/A'}/100</div>
                                                </div>
                                                <div className="bg-gray-50 p-3 rounded">
                                                    <div className="text-xs text-gray-500">Status</div>
                                                    <div className="font-medium capitalize">{result.status}</div>
                                                </div>
                                            </div>

                                            <div className="space-y-5 text-sm">
                                                <section>
                                                    <h5 className="font-medium mb-2">Buyer Verdict</h5>
                                                    <div className={`border p-3 rounded ${getVerdictColor(buyerVerdict.tone)}`}>
                                                        <div className="text-base font-semibold">{buyerVerdict.label}</div>
                                                        <p className="mt-1">{buyerVerdict.reasoning}</p>
                                                    </div>
                                                </section>

                                                <section>
                                                    <h5 className="font-medium mb-2">Executive Summary</h5>
                                                    <p className="text-gray-700">{result.explain.summary}</p>
                                                    <div className="mt-3 grid md:grid-cols-3 gap-3">
                                                        <div className="border rounded p-3">
                                                            <div className="text-xs text-gray-500">Passed Checks</div>
                                                            <div className="text-lg font-semibold text-green-700">{passedChecks.length}</div>
                                                        </div>
                                                        <div className="border rounded p-3">
                                                            <div className="text-xs text-gray-500">Failed Checks</div>
                                                            <div className="text-lg font-semibold text-red-700">{failedChecks.length}</div>
                                                        </div>
                                                        <div className="border rounded p-3">
                                                            <div className="text-xs text-gray-500">Unknown Checks</div>
                                                            <div className="text-lg font-semibold text-gray-700">{unknownChecks.length}</div>
                                                        </div>
                                                    </div>
                                                </section>

                                                <section>
                                                    <h5 className="font-medium mb-2">Key Findings</h5>
                                                    <div className="space-y-2">
                                                        {failedChecks.length === 0 && unknownChecks.length === 0 && (
                                                            <div className="bg-green-50 border border-green-200 text-green-800 p-3 rounded">
                                                                No failed or unknown structural checks were detected in this analysis.
                                                            </div>
                                                        )}
                                                        {failedChecks.map(check => (
                                                            <div key={check.id} className="bg-red-50 border border-red-200 text-red-800 p-3 rounded">
                                                                <span className="font-medium">{check.label}</span>: failed {check.severity.toLowerCase()} severity check.
                                                            </div>
                                                        ))}
                                                        {unknownChecks.map(check => (
                                                            <div key={check.id} className="bg-gray-50 border border-gray-200 text-gray-700 p-3 rounded">
                                                                <span className="font-medium">{check.label}</span>: data was unavailable, so this weight was excluded from the score.
                                                            </div>
                                                        ))}
                                                    </div>
                                                </section>

                                                <section>
                                                    <h5 className="font-medium mb-2">Evidence Review</h5>
                                                    <div className="space-y-3">
                                                        {result.checks.map(check => {
                                                            const component = checkComponent(result, check.id);
                                                            return (
                                                                <div key={check.id} className="border rounded p-3">
                                                                    <div className="flex items-start justify-between gap-3 mb-2">
                                                                        <div>
                                                                            <div className="font-medium">{check.label}</div>
                                                                            <div className="text-xs text-gray-500">
                                                                                {formatReportKey(check.category)} • {check.severity} severity • Weight {check.weight}
                                                                            </div>
                                                                        </div>
                                                                        <span className={`px-2 py-1 rounded border text-xs font-medium ${getStatusPill(check.status)}`}>
                                                                            {check.status}
                                                                        </span>
                                                                    </div>

                                                                    <div className="grid md:grid-cols-2 gap-2 text-xs">
                                                                        <div className="bg-gray-50 p-2 rounded">
                                                                            <span className="text-gray-500">Component Score:</span>{' '}
                                                                            <span className="font-medium">{check.score_component !== null ? `${check.score_component}/100` : 'Excluded'}</span>
                                                                        </div>
                                                                        <div className="bg-gray-50 p-2 rounded">
                                                                            <span className="text-gray-500">Weighted Points:</span>{' '}
                                                                            <span className="font-medium">{component?.weighted_points !== null && component?.weighted_points !== undefined ? component.weighted_points.toFixed(2) : 'Excluded'}</span>
                                                                        </div>
                                                                    </div>

                                                                    <dl className="mt-3 grid md:grid-cols-2 gap-2">
                                                                        {Object.entries(check.evidence || {}).map(([key, value]) => (
                                                                            <div key={key} className="bg-gray-50 p-2 rounded">
                                                                                <dt className="text-xs text-gray-500">{formatReportKey(key)}</dt>
                                                                                <dd className="text-gray-800 break-words">{formatReportValue(key, value)}</dd>
                                                                            </div>
                                                                        ))}
                                                                    </dl>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </section>

                                                <section>
                                                    <h5 className="font-medium mb-2">Scoring Method</h5>
                                                    <div className="bg-gray-50 p-3 rounded space-y-2">
                                                        <div><span className="font-medium">Model:</span> {result.score.model}</div>
                                                        <div><span className="font-medium">Active weight total:</span> {result.score.weights_total}</div>
                                                        {result.score.notes.map((note, idx) => (
                                                            <div key={idx} className="text-gray-700">{note}</div>
                                                        ))}
                                                    </div>
                                                </section>

                                                <section>
                                                    <h5 className="font-medium mb-2">Interpretation</h5>
                                                    <ul className="space-y-2">
                                                        {result.explain.interpretation.what_to_do.map((item, idx) => (
                                                            <li key={idx} className="text-gray-700">• {item}</li>
                                                        ))}
                                                    </ul>
                                                </section>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <details className="bg-gray-50 p-4 rounded">
                                <summary className="cursor-pointer font-medium">How this analysis works</summary>
                                <div className="mt-3 text-sm text-gray-700 space-y-2">
                                    <p>• This tool evaluates structural fairness, not price prediction.</p>
                                    <p>• Each check is verifiable on-chain and scored transparently.</p>
                                    <p>• Unknown data does not penalize the score.</p>
                                    <p>• Critical failures (mint authority or ownership not renounced) override all other checks.</p>
                                    <p>• Data fetched directly from blockchain via Helius (Solana) or Alchemy (Base/EVM).</p>
                                </div>
                            </details>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
